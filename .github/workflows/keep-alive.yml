name: Supabase Keep-Alive

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (~06:00 horário de Brasília)
    - cron: "0 9 * * 1"
  workflow_dispatch: {} # permite rodar manualmente pelo GitHub também

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/notes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP status: $response"

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Supabase respondeu com sucesso, projeto continua ativo."
          else
            echo "⚠️ Resposta inesperada do Supabase (status $response)."
            exit 1
          fi
